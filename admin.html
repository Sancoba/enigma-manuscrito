<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070503">
<title>Control del Manuscrito | RISE</title>
<style>
:root{--bg:#060403;--panel:#171008;--gold:#d8ad58;--light:#f5d58d;--text:#f4ead8;--muted:#ad9d82;--green:#80bd72;--red:#d46868;--line:rgba(216,173,88,.25)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,rgba(160,101,32,.17),transparent 32%),linear-gradient(#120c07,#030201);color:var(--text);font-family:Georgia,"Times New Roman",serif}.wrap{width:min(1180px,100%);margin:auto;padding:24px 14px 60px}.panel{border:1px solid var(--line);border-radius:16px;background:rgba(18,12,7,.94);box-shadow:0 25px 80px #000;padding:22px}.eyebrow{color:var(--gold);font:900 10px Arial,sans-serif;letter-spacing:3px;text-align:center}.title{margin:8px 0 5px;text-align:center;color:var(--light);font-size:clamp(30px,6vw,52px);text-transform:uppercase}.sub{text-align:center;color:var(--muted);margin:0 0 22px}.login{max-width:470px;margin:9vh auto}.field{margin:15px 0}.field label{display:block;color:var(--light);margin-bottom:7px}.input{width:100%;padding:15px;border:1px solid var(--line);border-radius:9px;background:#080503;color:white;outline:none}.btn{width:100%;padding:14px 16px;border:1px solid rgba(245,211,140,.55);border-radius:9px;background:linear-gradient(#f1d083,#b78235);color:#201507;font-weight:900;cursor:pointer}.btn.secondary{width:auto;background:transparent;color:var(--light);border-color:var(--line)}.error{color:#ffb5b5;text-align:center;min-height:22px;margin-top:12px}.topbar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{padding:14px;border:1px solid var(--line);border-radius:10px;background:#0c0805;text-align:center}.stat span{display:block;color:var(--muted);font:800 9px Arial,sans-serif;letter-spacing:1px;text-transform:uppercase}.stat strong{display:block;color:var(--light);font-size:24px;margin-top:5px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:13px 11px;border-bottom:1px solid rgba(216,173,88,.12);text-align:left}th{position:sticky;top:0;background:#171008;color:var(--gold);font:900 10px Arial,sans-serif;letter-spacing:1px;text-transform:uppercase}tr.podium{background:rgba(216,173,88,.07)}.team{font-weight:800;color:var(--light)}.code{font-family:monospace;color:var(--muted)}.seals{display:flex;gap:5px}.seal{width:28px;height:28px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font:800 10px Arial,sans-serif;color:#6e6251}.seal.done{color:#dff3d9;border-color:rgba(128,189,114,.55);background:rgba(64,116,53,.28)}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font:800 9px Arial,sans-serif;letter-spacing:.7px}.playing{background:rgba(216,173,88,.12);color:var(--gold)}.finished{background:rgba(70,135,58,.24);color:#bfe5b6}.blocked{background:rgba(150,45,45,.25);color:#efaaaa}.hidden{display:none!important}.sync{font:800 10px Arial,sans-serif;color:var(--muted);letter-spacing:1px}.rank{font-size:20px;font-weight:900;text-align:center}.empty{text-align:center;color:var(--muted);padding:35px!important}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.panel{padding:16px}.wrap{padding:12px 9px 40px}}
</style>
</head>
<body>
<div class="wrap">
<section id="dashboardView" class="panel">
<div class="topbar"><div><div class="eyebrow" style="text-align:left">RISE · CONTROL EN VIVO</div><h1 style="margin:5px 0;color:var(--light)">Control del Manuscrito</h1><div id="syncText" class="sync">CONECTANDO...</div></div><button class="btn secondary" onclick="loadTeams()">↻ ACTUALIZAR</button></div>
<div class="stats"><div class="stat"><span>Equipos</span><strong id="sTeams">0</strong></div><div class="stat"><span>Finalizados</span><strong id="sFinished">0</strong></div><div class="stat"><span>En juego</span><strong id="sPlaying">0</strong></div><div class="stat"><span>En Guardián</span><strong id="sBlocked">0</strong></div></div>
<div class="tablewrap"><table><thead><tr><th>Puesto</th><th>Equipo</th><th>Sellos</th><th>Progreso</th><th>Llamas</th><th>Estado</th><th>Finalizó</th></tr></thead><tbody id="teamsBody"><tr><td colspan="7" class="empty">Cargando equipos...</td></tr></tbody></table></div>
</section>
</div>
<script>
const SUPABASE_URL="https://wdbbubvmofmyhdtwcsry.supabase.co";
const SUPABASE_KEY="sb_publishable_NwnpwizxXFft8Ohh1F_n9Q_E5g-Yzla";
let timer=null;
async function rpc(name,params={}){const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY},body:JSON.stringify(params)});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.message||d?.error||"No fue posible cargar el panel.");return d}
function esc(v){const d=document.createElement("div");d.textContent=v??"";return d.innerHTML}
function time(v){if(!v)return"—";return new Date(v).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
async function loadTeams(){try{const r=await rpc("panel_admin");if(!r?.ok)throw new Error(r?.error||"No autorizado");const teams=r.equipos||[];document.getElementById("sTeams").textContent=teams.length;document.getElementById("sFinished").textContent=teams.filter(x=>x.finalizado).length;document.getElementById("sPlaying").textContent=teams.filter(x=>!x.finalizado&&!x.bloqueado&&Number(x.vidas)>0).length;document.getElementById("sBlocked").textContent=teams.filter(x=>!x.finalizado&&(x.bloqueado||Number(x.vidas)<=0)).length;const body=document.getElementById("teamsBody");if(!teams.length){body.innerHTML='<tr><td colspan="7" class="empty">Todavía no hay equipos registrados.</td></tr>'}else body.innerHTML=teams.map(x=>{const rank=x.puesto==1?'🥇':x.puesto==2?'🥈':x.puesto==3?'🥉':(x.puesto||'—');const seals=(x.estaciones||[]).map(s=>`<span class="seal ${s.completada?'done':''}">${s.numero}</span>`).join('');let st=x.finalizado?'<span class="badge finished">FINALIZADO</span>':(x.bloqueado||Number(x.vidas)<=0)?'<span class="badge blocked">GUARDIÁN</span>':'<span class="badge playing">EN JUEGO</span>';return `<tr class="${x.puesto&&x.puesto<=3?'podium':''}"><td class="rank">${rank}</td><td><div class="team">${esc(x.nombre)}</div><div class="code">${esc(x.codigo_equipo)}</div></td><td><div class="seals">${seals}</div></td><td>${x.completadas}/6</td><td>${x.vidas}/3</td><td>${st}</td><td>${time(x.finalizado_en)}</td></tr>`}).join('');document.getElementById("syncText").textContent="● EN VIVO · "+new Date().toLocaleTimeString("es-CO") }catch(e){document.getElementById("syncText").textContent="SIN CONEXIÓN · "+e.message}}
loadTeams();timer=setInterval(loadTeams,3000);
</script>
</body></html>
